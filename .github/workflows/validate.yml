name: Validate handbook
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate content and generated outputs
        run: python3 build.py --check
      - name: Check browser script syntax
        run: node --check ui.js
      - name: Check whitespace errors
        run: git diff --check
